name: Validate Kavazi

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: validate-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository records
        run: python kavazi.py check --repo .
      - name: Build the distributable archive
        run: python scripts/build_plugin.py --output dist/kavazi-method-0.1.0.zip

  ci:
    name: CI
    needs: validate
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job to pass
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        shell: python
        run: |
          import os
          import sys

          if os.environ.get("VALIDATION_RESULT") != "success":
              print("::error::Every Python validation job must pass.")
              sys.exit(1)
          print("All Python validation jobs passed.")
